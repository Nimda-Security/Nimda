version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nimda-mysql
    networks:
      - nimda-network
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 메모리 설정 최적화 (1GB RAM 환경)
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
    expose:
      - "3306" # DB 외부 접근 차단
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: nimda-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    networks:
      - nimda-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 기존 서버
  backend-blue:
    image: xtkww971/nimda-backend:latest
    container_name: backend-blue
    # DB 실행 조건 설정
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 내부 컨테이너만 접근 가능하게 설정
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - nimda-network
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    environment:
      # 시간대 설정
      - TZ=Asia/Seoul
      # MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # Redis (인증코드 저장 / 채점 큐) — 누락 시 백엔드가 localhost:6379 로 붙어
      # 비밀번호 재설정 메일 인증과 채점 큐가 운영에서 조용히 실패한다.
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      # 채점 결과 콜백 공유 시크릿 (미설정 시 콜백 전면 거부)
      - JUDGE_CALLBACK_SECRET=${JUDGE_CALLBACK_SECRET}
      # CORS 허용 Origin (콤마 구분)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://nimda.kr,https://*.nimda.kr}
      # 인증 쿠키 Secure 속성
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
    restart: always

  backend-green:
    image: xtkww971/nimda-backend:latest
    container_name: backend-green
    networks:
      - nimda-network
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - TZ=Asia/Seoul
      # MySQL 연결 정보
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # Redis (인증코드 저장 / 채점 큐)
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      # 채점 결과 콜백 공유 시크릿 (미설정 시 콜백 전면 거부)
      - JUDGE_CALLBACK_SECRET=${JUDGE_CALLBACK_SECRET}
      # CORS 허용 Origin (콤마 구분)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://nimda.kr,https://*.nimda.kr}
      # 인증 쿠키 Secure 속성
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nimda-nginx
    depends_on:
      - backend-blue
      - backend-green
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    networks:
      - nimda-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # nginx 설정 파일 마운트
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      # blue - green의 주소가 담긴 설정 파일
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: always

# 볼륨 정의 (데이터 영속성)
volumes:
  mysql_data:
  redis_data:
  certbot-www: # Let's Encrypt 인증용 웹루트
  certbot-conf: # Let's Encrypt 인증서 저장소

# 도커 컨테이너 네트워크 설정
networks:
  nimda-network:
    driver: bridge