services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    command:
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    container_name: nimda-mysql
    networks:
      - nimda-network
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306" # DB 외부 접근 차단
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    container_name: nimda-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    networks:
      - nimda-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 기존 서버
  backend-blue:
    image: xtkww971/nimda-backend:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG must be an immutable image tag}
    container_name: backend-blue
    # DB 실행 조건 설정
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 내부 컨테이너만 접근 가능하게 설정
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - nimda-network
    healthcheck:
      test: [ "CMD-SHELL", "status=$$(curl --fail --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 2 --max-time 3 http://localhost:8080/api/cite/category) && [ \"$$status\" -ge 200 ] && [ \"$$status\" -lt 300 ]" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    environment:
      # 시간대 설정
      - TZ=Asia/Seoul
      # MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # Redis
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    restart: always

  backend-green:
    image: xtkww971/nimda-backend:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG must be an immutable image tag}
    container_name: backend-green
    networks:
      - nimda-network
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "status=$$(curl --fail --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 2 --max-time 3 http://localhost:8080/api/cite/category) && [ \"$$status\" -ge 200 ] && [ \"$$status\" -lt 300 ]" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - TZ=Asia/Seoul
      # MySQL 연결 정보
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # Redis
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    restart: always

  nginx:
    image: nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: nimda-nginx
    depends_on:
      - backend-blue
      - backend-green
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    networks:
      - nimda-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # nginx 설정 파일 마운트
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      # blue - green의 주소가 담긴 설정 파일
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: always

# 볼륨 정의 (데이터 영속성)
volumes:
  mysql_data:
  redis_data:
  certbot-www: # Let's Encrypt 인증용 웹루트
  certbot-conf: # Let's Encrypt 인증서 저장소

# 도커 컨테이너 네트워크 설정
networks:
  nimda-network:
    driver: bridge