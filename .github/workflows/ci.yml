name: Nimda CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: nimda-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 전체 코드 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 소스코드 받기
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "NimdaConBackEnd/backend-spring/pom.xml"

      - name: Node.js 22 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            NimdaConFrontEnd/package-lock.json
            NimdaLandingPage/package-lock.json

      - name: 커뮤니티 프론트엔드 검증
        working-directory: NimdaConFrontEnd
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          npm run build

      - name: 랜딩 페이지 검증
        working-directory: NimdaLandingPage
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          npm run build

      - name: 백엔드 테스트 및 패키징
        working-directory: NimdaConBackEnd/backend-spring
        run: ./mvnw -B clean verify

  build-and-deploy:
    name: 운영 이미지 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Nimda-Security/Nimda'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 소스코드 받기
        uses: actions/checkout@v4

      - name: 깃 해시 추출
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 도커허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./NimdaConBackEnd/backend-spring
          file: ./NimdaConBackEnd/backend-spring/Dockerfile
          push: true
          tags: xtkww971/nimda-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.sh,docker-compose.yml,nginx/nginx.conf"
          target: "/home/ubuntu/app"

      - name: 운영 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            chmod +x deploy.sh
            BACKEND_IMAGE_TAG=${{ steps.vars.outputs.sha_short }} ./deploy.sh