name: CI Pipeline

on:
  push:
    branches: [ main, develop, be ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and Test with Maven
        working-directory: NimdaConBackEnd/backend-spring
        run: mvn clean package
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_USER_NAME: ${{ secrets.SPRING_SECURITY_USER_NAME }}
          SPRING_SECURITY_USER_PASSWORD: ${{ secrets.SPRING_SECURITY_USER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: NimdaConBackEnd/backend-spring/target/*.jar
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: NimdaConBackEnd/backend-spring
        run: |
          docker build -t xtkww971/nimda-backend:latest .

      - name: Clean up Docker images
        run: docker image prune -f

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Push Docker image
        run: docker push xtkww971/nimda-backend:latest

      # 11단계: 서버에 SSH로 접속하여 docker-compose.yml 생성 및 배포
      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            mkdir -p ${{ secrets.SERVER_DEPLOY_PATH }}
            cd ${{ secrets.SERVER_DEPLOY_PATH }}

            echo '=== docker-compose.yml 생성 중 ==='
            cat <<'EOF'> docker-compose.yml
            version: '3.8'

            services:
              # MySQL 데이터베이스 서비스
              mysql:
                image: mysql:8.0
                container_name: nimda-mysql
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                  MYSQL_DATABASE: ${MYSQL_DATABASE}
                  MYSQL_USER: ${MYSQL_USER}
                  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
                  # 메모리 제한 설정 (1GB RAM 환경)
                  MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
                ports:
                  - "3306:3306" # 외부 접근이 필요하면 포트 열기 (보안상 필요없으면 제거 가능)
                volumes:
                  - mysql_data:/var/lib/mysql
                healthcheck:
                  test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
                  interval: 10s
                  timeout: 5s
                  retries: 5
            
              # Spring Boot 백엔드 서비스
              backend:
                image: xtkww971/nimda-backend:latest
                container_name: nimda-backend
                depends_on:
                  mysql:
                    condition: service_healthy # MySQL이 준비될 때까지 대기
                # 포트 매핑 제거 (내부 네트워크에서만 접근, nginx를 통해 접근)
                expose:
                  - "8080" # 내부 네트워크에서만 접근 가능
                environment:
                  # 시간대 설정 (한국 시간)
                  - TZ=Asia/Seoul
                  # MySQL 연결 정보 (docker-compose 내부 네트워크에서 서비스 이름으로 접근)
                  - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
                  - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
                  - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
                  # Spring Boot 포트 설정
                  - SERVER_PORT=8080
                  # AWS S3 설정 —
                  # 오른쪽은 자바 코드에서 읽는 변수 / env에서 가지고 올 값
                  - aws.s3.bucket=${AWS_S3_BUCKET}
                  - aws.s3.region=${AWS_S3_REGION}
                  - aws.s3.access-key=${AWS_S3_ACCESS_KEY}
                  - aws.s3.secret-key=${AWS_S3_SECRET_KEY}
                  # JWT 시크릿 (반드시 .env 파일에 안전한 값으로 설정)
                  - JWT_SECRET=${JWT_SECRET}
                restart: always
            
              # Nginx 리버스 프록시 서비스
              nginx:
                image: nginx:alpine
                container_name: nimda-nginx
                depends_on:
                  - backend # 백엔드가 준비될 때까지 대기
                ports:
                  - "80:80" # HTTP
                  - "443:443" # HTTPS
                volumes:
                  - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # nginx 설정 파일 마운트
                  - ./certbot/www:/var/www/certbot
                  - ./certbot/conf:/etc/letsencrypt
                restart: always
            
            # 볼륨 정의 (데이터 영속성)
            volumes:
              mysql_data:
              certbot-www: # Let's Encrypt 인증용 웹루트
              certbot-conf: # Let's Encrypt 인증서 저장소
                      
            EOF
                      
            echo '=== 배포 프로세스 시작 ==='
            docker compose down || true
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
            echo '=== 배포 완료 ==='
          "