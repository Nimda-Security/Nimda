name: Nimda CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      # 1. Gradle 대신 Maven 캐시로 변경하고, pom.xml의 정확한 경로를 지정합니다.
      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          dependency-path: 'NimdaConBackEnd/backend-spring/pom.xml'

      - name: 깃 해시 추출
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 2. ./gradlew 대신 Maven 빌드 명령어(mvn)를 사용하며, working-directory를 지정합니다.
      - name: 메이븐 빌드 (테스트 제외)
        run: mvn clean package -DskipTests
        working-directory: NimdaConBackEnd/backend-spring

      - name: 도커허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 3. 도커 빌드 컨텍스트와 Dockerfile 경로도 하위 폴더에 맞게 수정합니다.
      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./NimdaConBackEnd/backend-spring
          file: ./NimdaConBackEnd/backend-spring/Dockerfile
          push: true
          tags: |
            xtkww971/nimda-backend:latest
            xtkww971/nimda-backend:${{ steps.vars.outputs.sha_short }}

      - name: 운영 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            git pull origin main
            ./deploy.sh