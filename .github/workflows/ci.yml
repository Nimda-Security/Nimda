name: CI Pipeline

on:
  push:
    branches: [ main, develop, be ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and Test with Maven
        working-directory: NimdaConBackEnd/backend-spring
        run: mvn clean package
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_USER_NAME: ${{ secrets.SPRING_SECURITY_USER_NAME }}
          SPRING_SECURITY_USER_PASSWORD: ${{ secrets.SPRING_SECURITY_USER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: NimdaConBackEnd/backend-spring/target/*.jar
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with unique tag
        working-directory: NimdaConBackEnd/backend-spring
        run: |
          # 고유 태그: commit hash + 짧은 번호
          IMAGE_TAG="${{ github.sha }}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "BUILD_TAG=xtkww971/nimda-backend:${IMAGE_TAG:0:8}"
          
          # 고유 태그로 빌드
          docker build -t xtkww971/nimda-backend:${IMAGE_TAG:0:8} .
          # latest도 함께 태깅
          docker tag xtkww971/nimda-backend:${IMAGE_TAG:0:8} xtkww971/nimda-backend:latest

      - name: Clean up dangling Docker images
        run: |
          docker image prune -f

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Push Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          SHORT_TAG=${IMAGE_TAG:0:8}
          
          # 고유 태그와 latest 모두 push
          docker push xtkww971/nimda-backend:${SHORT_TAG}
          docker push xtkww971/nimda-backend:latest
          
          echo "🐳 푸시된 이미지:"
          echo "  - xtkww971/nimda-backend:${SHORT_TAG}"
          echo "  - xtkww971/nimda-backend:latest"

      # Blue-Green 무중단 배포
      - name: Deploy to server (Zero-Downtime)
        run: |
          IMAGE_TAG="${{ github.sha }}"
          SHORT_TAG=${IMAGE_TAG:0:8}
          BACKEND_IMAGE="xtkww971/nimda-backend:${SHORT_TAG}"
          
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            DEPLOY_PATH='${{ secrets.SERVER_DEPLOY_PATH }}'
            cd \$DEPLOY_PATH
            
            echo '=========================================='
            echo '🚀 무중단 배포 시작'
            echo '   이미지 태그: ${SHORT_TAG}'
            echo '=========================================='
            
            # 배포 스크립트 실행 (이미지 태그 전달)
            if [ -f 'deploy.sh' ]; then
              echo '[배포 방식] deploy.sh 사용'
              chmod +x deploy.sh
              BACKEND_IMAGE_TAG='${BACKEND_IMAGE}' ./deploy.sh deploy || {
                echo '❌ deploy.sh 실행 실패. 수동 배포로 전환합니다'
                exit 1
              }
            else
              echo '[배포 방식] 수동 배포 (deploy.sh 미존재)'
              echo ''
              echo '[Step 1/3] 이미지 다운로드 및 컨테이너 업데이트...'
              
              # 환경변수 설정
              export BACKEND_IMAGE_TAG='${BACKEND_IMAGE}'
              
              # docker-compose pull 및 서비스 업데이트
              docker compose pull backend-blue backend-green
              docker compose up -d backend-blue backend-green nginx mysql
              
              echo '[Step 2/3] 헬스체크...'
              sleep 3
              for i in {1..30}; do
                if docker exec nimda-backend-blue curl -s -f http://localhost:8080/api/health > /dev/null 2>&1; then
                  echo '✓ 헬스체크 성공'
                  break
                fi
                if [ \$i -eq 30 ]; then
                  echo '❌ 헬스체크 실패'
                  exit 1
                fi
                sleep 1
              done
              
              echo '[Step 3/3] 이미지 정리...'
              docker image prune -af
              echo '✓ 수동 배포 완료'
            fi
            
            echo '=========================================='
            echo '✓ 배포 완료'
            echo '=========================================='
          "