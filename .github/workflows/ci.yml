name: CI Pipeline

on:
  push:
    branches: [ main, develop, be ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and Test with Maven
        working-directory: NimdaConBackEnd/backend-spring
        run: mvn clean package
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_USER_NAME: ${{ secrets.SPRING_SECURITY_USER_NAME }}
          SPRING_SECURITY_USER_PASSWORD: ${{ secrets.SPRING_SECURITY_USER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: NimdaConBackEnd/backend-spring/target/*.jar
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: NimdaConBackEnd/backend-spring
        run: |
          docker build -t xtkww971/nimda-backend:latest .

      - name: Clean up Docker images
        run: docker image prune -f

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Push Docker image
        run: docker push xtkww971/nimda-backend:latest

      # Blue-Green 무중단 배포
      - name: Deploy to server (Zero-Downtime)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            
            echo '=========================================='
            echo '🚀 무중단 배포 시작'
            echo '=========================================='
            
            # 배포 스크립트 실행
            if [ -f 'deploy.sh' ]; then
              chmod +x deploy.sh
              ./deploy.sh deploy
            else
              echo '❌ deploy.sh 파일을 찾을 수 없습니다'
              echo '초기 배포를 수행합니다...'
              docker-compose pull
              docker-compose up -d backend-blue backend-green nginx mysql
              docker image prune -af
            fi
            
            echo '=========================================='
            echo '✓ 배포 완료'
            echo '=========================================='
          "