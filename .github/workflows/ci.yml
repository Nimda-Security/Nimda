name: Nimda CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: nimda-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          dependency-path: 'NimdaConBackEnd/backend-spring/pom.xml'

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            NimdaConFrontEnd/package-lock.json
            NimdaLandingPage/package-lock.json

      - name: 커뮤니티 프론트엔드 검증
        working-directory: NimdaConFrontEnd
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          npm run build

      - name: 랜딩 페이지 검증
        working-directory: NimdaLandingPage
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          npm run build

      - name: 깃 해시 추출
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 백엔드 테스트 및 패키징
        run: ./mvnw -B clean verify
        working-directory: NimdaConBackEnd/backend-spring

      - name: 도커허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./NimdaConBackEnd/backend-spring
          file: ./NimdaConBackEnd/backend-spring/Dockerfile
          push: true
          tags: xtkww971/nimda-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 스크립트 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.sh,docker-compose.yml,nginx/nginx.conf"
          target: "/home/ubuntu/app"


      - name: 운영 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            chmod +x deploy.sh
            BACKEND_IMAGE_TAG=${{ steps.vars.outputs.sha_short }} ./deploy.sh