name: Nimda CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 깃 해시 7자리를 추출하여 환경 변수에 저장 (deploy.sh의 CURRENT_VERSION과 매칭용)
      - name: 깃 해시 추출
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 그레이들 빌드 (테스트 제외)
        run: ./gradlew bootJar -x test

      - name: 도커허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 하나의 이미지를 만들 때 두 개의 태그(:latest와 :깃해시)를 동시에 부여해서 push합니다.
      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            xtkww971/nimda-backend:latest
            xtkww971/nimda-backend:${{ steps.vars.outputs.sha_short }}

      # 빌드가 끝나면 운영 서버(EC2 등)에 접속해서 배포 스크립트를 실행시킵니다.
      - name: 운영 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            git pull origin main
            ./deploy.sh