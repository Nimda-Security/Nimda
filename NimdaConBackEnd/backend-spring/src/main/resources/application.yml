app:
  version: ${APP_VERSION:1.0.0}
  
spring:
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
  application:
    name: nimda-cup
  # 이메일 설정 (Spring Mail)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:applicationMailUserName}
    password: ${MAIL_PASSWORD:applicationMailPassword}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nimda_con?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: none
      open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true # sql Formatting
        show_sql: false
    defer-datasource-initialization: false

  
  sql:
    init:
      mode: never  # 초기 데이터는 수동으로 import 또는 data.sql 사용 
  
  # Flyway 설정 (spring.flyway 하위에 위치해야 Spring Boot가 인식)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true  # 기존 DB가 있을 경우 baseline 설정
    repair-on-migrate: true
    validate-on-migrate: false
    clean-disabled: true
    out-of-order: true  # DB에서 version 10이 빠진 경우 등, 순서 밖 마이그레이션 허용
  
  # spring.security.user(인메모리 기본 유저) 설정은 제거했다.
  # 커스텀 SecurityFilterChain + JWT 필터가 인증을 담당하므로 사용되지 않는 값이었고,
  # 기본값 없는 ${SPRING_SECURITY_USER_NAME}/${...PASSWORD} 플레이스홀더가
  # docker-compose 에서 주입되지 않아 부팅 실패 위험만 남기고 있었다.
  
  # 파일 업로드 설정 (Multipart)
  servlet:
    multipart:
      max-file-size: 10MB        # 파일당 최대 크기 (nginx의 client_max_body_size와 일치)
      max-request-size: 10MB     # 요청 전체 최대 크기
      enabled: true

server:
  # 환경변수로 오버라이드 가능 (docker-compose.yml에서 설정)
  # 기본값: 8080 (nginx가 프록시하므로 내부 포트 사용)
  port: ${SERVER_PORT:8080}

# JWT 설정
jwt:
  header: Authorization # JWT Token을 Request Header에서 탐색할 때 사용할 헤더 이름
  secret: ${JWT_SECRET:} # JWT 토큰 서명 검증키 (Base64 인코딩됨)
  # 토큰 만료 시간(초). TokenProvider/JwtUtil 이 모두 이 값을 사용한다.
  token-validity-in-seconds: ${JWT_TOKEN_VALIDITY_SECONDS:86400}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

judge:
  queue:
    stream-key: ${JUDGE_QUEUE_STREAM_KEY:judge:submissions}
    consumer-group: ${JUDGE_QUEUE_CONSUMER_GROUP:judge-workers}
  callback:
    # 채점 서버 -> 백엔드 결과 콜백(POST /api/judge/submission/result) 공유 시크릿.
    # 미설정 시 콜백은 전부 거부된다(fail-closed). 반드시 환경변수로 주입할 것.
    secret: ${JUDGE_CALLBACK_SECRET:}

# CORS 허용 Origin (콤마 구분). allowCredentials=true 이므로 서드파티 와일드카드 금지.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nimda.kr,https://*.nimda.kr,http://localhost:*,http://127.0.0.1:*}

# 첨부파일 로컬 저장 (cite attachment)
nimda:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:${user.home}/nimda-attachments}

# S3: AWS_S3_ACCESS_KEY / AWS_S3_SECRET_KEY 둘 다 설정 시에만 S3Client·Presigner 빈이 등록됩니다.
# 미설정 시 첨부는 nimda.file.upload-dir(로컬 디스크)만 사용합니다.
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:nimda-bucket}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}

    # 파일 저장 경로 
    profile-image-path: profiles/ # 프로필 이미지 저장
    board-image-path: boards/ # 게시판 이미지
    board-file-path: boards/files/ # 게시판 첨부파일
    problem-file-path: problems/

    # 파일 크기 제한 
    max-file-size: 10485760 # 10mb
    allowed-image-types: jpg,jpeg,png,gif,webp # 허용 이미지 타입
    allowed-file-types: pdf,doc,docx,xls,xlsx,zip  # 허용된 파일 타입

logging:
  level:
    com.nimda.cite.common.s3: ${LOG_LEVEL_S3:INFO}
    org.springframework.boot.autoconfigure.condition: ${LOG_LEVEL_AUTOCONFIG:INFO}
    com.nimda.cup: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
    # 운영에서 DEBUG/TRACE 로 켜면 SQL 문과 바인딩 파라미터(비밀번호 해시·이메일·학번)가
    # 그대로 로그에 남는다. 기본은 OFF 로 두고 로컬 디버깅 시에만 환경변수로 올린다.
    org.hibernate.SQL: ${LOG_LEVEL_SQL:OFF}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_BIND:OFF}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BIND:OFF}
