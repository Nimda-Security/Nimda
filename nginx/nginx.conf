events {
    worker_connections 1024;
}

http {
    # [기본 설정 및 성능 최적화]
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # [Rate Limit 설정]
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 도커 컴포즈 서비스 이름인 'backend'를 사용합니다.
    upstream backend_server {
        server backend:8080;
    }

    # HTTP 서버 (포트 80)
    server {
        listen 80;
        server_name api.nimda.kr 43.200.36.32 *.nimda.kr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # HTTP를 HTTPS로 리다이렉트 (도메인인 경우에만)
        location / {
            # 도메인 요청인 경우만 HTTPS로 리다이렉트
            if ($host ~ ^api\.nimda\.kr$) {
                return 301 https://$server_name$request_uri;
            }
            # IP 주소 또는 기타는 그대로 처리
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS 서버 (포트 443)
    server {
        listen 443 ssl; # http2 경고 수정을 위해 분리
        http2 on;
        server_name api.nimda.kr *.nimda.kr;

        # 발급 완료된 인증서 경로
        ssl_certificate /etc/letsencrypt/live/api.nimda.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.nimda.kr/privkey.pem;

        # [보안 헤더]
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # [보안 필터링]
        if ($query_string ~* "(<|%3C).*script.*(>|%3E)") { return 403; }
        if ($query_string ~* "union.*select") { return 403; }
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$ ) { return 405; }

        # 민감 파일 접근 금지
        location ~* \.(env|log|git|sh|bak|php|sql)$ {
            deny all;
        }

        # API 요청 (Spring Boot 프록시)
        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 그 외 모든 요청
        location / {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}