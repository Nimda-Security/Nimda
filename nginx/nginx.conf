events {
    worker_connections 1024;
}

http {
    # [기본 설정 및 성능 최적화]
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off; # 서버 버전 숨기기

    # [프론트 조작 및 도배 방지: Rate Limit]
    # IP당 초당 10번 요청 허용, 순간적인 버스트는 20개까지
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 로그 설정
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    upstream backend {
        server backend:8080;
    }

    # HTTP 서버 (포트 80) - HTTPS 리다이렉트
    server {
        listen 80;
        server_name api.nimda.kr;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS 서버 (포트 443)
    server {
        listen 443 ssl http2;
        server_name api.nimda.kr;

        # SSL 인증서 (경로 주의!)
        ssl_certificate /etc/letsencrypt/live/api.nimda.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.nimda.kr/privkey.pem;

        # [보안 헤더: 브라우저 보호]
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # [엔진X 필터링: 공격 스크립트 차단]
        if ($query_string ~* "(<|%3C).*script.*(>|%3E)") { return 403; }
        if ($query_string ~* "union.*select") { return 403; }

        # [허용되지 않는 메소드 차단]
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|HEAD)$ ) {
            return 405;
        }

        # [민감 파일 접근 금지]
        location ~* \.(env|log|git|sh|bak|php|sql)$ {
            deny all;
        }

        # API 요청 (Spring Boot 프록시)
        location /api {
            # [Rate Limit 적용]
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 그 외 모든 요청
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}